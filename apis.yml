aid: augment
name: Augment
description: >-
  Augment (Augie) is an AI productivity platform for the freight and logistics
  industry, automating complex supply-chain workflows for brokerages, carriers,
  and distributors — quoting, booking, load building, capacity sourcing, track &
  trace, carrier support, and order-to-cash — while integrating with existing TMS,
  ERP, email, and messaging systems. Its public REST API (api.prod.goaugment.com)
  lets partner systems manage loads and route stops, upsert and archive carriers,
  post tracking events, report carrier issues, and configure webhook endpoints and
  event subscriptions across nine event types. Authentication is HTTP Basic with an
  API key; the company is SOC 2 Type II certified. Augment is backed by 8VC,
  Lightspeed Venture Partners, and Redpoint Ventures.
